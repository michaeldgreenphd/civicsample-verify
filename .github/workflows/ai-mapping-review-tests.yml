name: AI mapping runner offline checks
on:
  pull_request:
    paths:
      - 'scripts/ai-mapping-review/**'
      - 'tests/ai-mapping-review.test.ts'
      - '.github/workflows/ai-mapping-review*.yml'
      - '.github/workflows/ai-label-pilot.yml'
  push:
    branches: ['codex/ai-mapping-comparison', main]
    paths:
      - 'scripts/ai-mapping-review/**'
      - 'tests/ai-mapping-review.test.ts'
      - '.github/workflows/ai-mapping-review*.yml'
      - '.github/workflows/ai-label-pilot.yml'
permissions:
  contents: read
jobs:
  mocked-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fictional input and mocked provider only
        run: python -m unittest discover -s scripts/ai-mapping-review -p 'test_*.py' -q
