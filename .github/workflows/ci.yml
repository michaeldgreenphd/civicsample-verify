name: Synthetic verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:handoff
      - name: Seed synthetic runtime-file packaging probe
        run: node -e "const fs=require('node:fs'); fs.mkdirSync('.local/pglite',{recursive:true}); fs.writeFileSync('.local/pglite/SYNTHETIC-TRACE-PROBE','Synthetic packaging regression only');"
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:production
      - run: npm audit --audit-level=high
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: analysis/requirements.txt
      - run: python -m pip install -r analysis/requirements.txt
      - run: python -m pytest -q analysis
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --import tsx --test tests/formal-export.test.ts tests/tlv5.test.ts
        env:
          VERIFY_ANALYSIS_PYTHON: python3
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic_ci_password
          POSTGRES_DB: verify_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:postgres
        env:
          VERIFY_PG_REQUIRE: '1'
          VERIFY_PG_TEST_URL: postgres://postgres:synthetic_ci_password@127.0.0.1:5432/verify_test
      - name: Current v5 database boundaries and concurrency
        run: node --import tsx --test tests/tlv5-postgres.test.ts tests/mapconf-postgres.test.ts tests/mu7-postgres.test.ts
        env:
          VERIFY_PG_REQUIRE: '1'
          VERIFY_PG_TEST_URL: postgres://postgres:synthetic_ci_password@127.0.0.1:5432/verify_test
      - run: npm run test:handoff:postgres -- --report docs/test_runs/native-handoff.json
        env:
          VERIFY_PG_REQUIRE: '1'
          VERIFY_PG_TEST_URL: postgres://postgres:synthetic_ci_password@127.0.0.1:5432/verify_test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-handoff-verification
          path: docs/test_runs/native-handoff.json
          if-no-files-found: error
